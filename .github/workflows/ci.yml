name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            solution: src/WindowsShims.slnx
          - os: macos-latest
            solution: src/WindowsShims.slnx
          - os: windows-latest
            solution: src/WindowsShims.slnx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Guard budget check
        if: runner.os != 'Windows'
        run: python3 scripts/count-guards.py --gate
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: ./build.windows.bat Release
      - name: Build (macOS/Linux)
        if: runner.os != 'Windows'
        run: dotnet build -c Release ${{ matrix.solution }}
      - name: Run unit tests (desktop)
        run: dotnet run --project src/LeXtudio.Windows.Tests/LeXtudio.Windows.Tests.csproj -c Release -f net10.0-desktop --no-build -- --parallel none
      - name: Run unit tests (WinUI)
        if: runner.os == 'Windows'
        run: dotnet run --project src/LeXtudio.Windows.Tests/LeXtudio.Windows.Tests.csproj -c Release -f net10.0-windows10.0.19041.0 --no-build -- --parallel none
      - name: Run RichTextBox integration tests (desktop)
        if: runner.os != 'Linux'
        run: dotnet run --project tests/RichTextBox.IntegrationTests/RichTextBox.IntegrationTests.csproj -c Release -f net10.0 --no-build -- --parallel none
      # Running the suite against that head is not enabled yet: the shim cannot build a
      # RichTextBox on WinAppSDK. WinUI binds a DependencyProperty to its registering
      # owner type, so GetValue with the WPF-shim DPs fails with E_INVALIDARG where WPF
      # (global DPs) and Uno (permissive lookup) both succeed. Re-enable once the shim's
      # property-system bridge handles WinAppSDK ownership.
      # - name: Run RichTextBox integration tests (WinUI)
      #   if: runner.os == 'Windows'
      #   run: dotnet run --project tests/RichTextBox.IntegrationTests/RichTextBox.IntegrationTests.csproj -c Release -f net10.0 -- --parallel none
      #   env:
      #     DOTNET_HOST_TFM: net10.0-windows10.0.19041.0
      - name: Run DataGrid integration tests (desktop)
        if: runner.os != 'Linux'
        run: dotnet run --project tests/DataGrid.IntegrationTests/DataGrid.IntegrationTests.csproj -c Release -f net10.0 --no-build -- --parallel none
      # DataGrid's host is still Skia-only (net10.0-desktop), so DOTNET_HOST_TFM had no
      # WinUI head to launch and this step could never have worked. Left disabled until
      # that host gains a WinUI 3 head the way RichTextBox's did.
      # - name: Run DataGrid integration tests (WinUI)
      #   if: runner.os == 'Windows'
      #   run: dotnet run --project tests/DataGrid.IntegrationTests/DataGrid.IntegrationTests.csproj -c Release -f net10.0 -- --parallel none
      #   env:
      #     DOTNET_HOST_TFM: net10.0-windows10.0.19041.0